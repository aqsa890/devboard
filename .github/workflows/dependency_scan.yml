name: Dependency scan

on:
  workflow_call:

jobs:
  dependency-scan:
    runs-on: ubuntu-latest

    strategy:
        matrix: 
         folder: ['frontend', 'backend']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
            go-version: 1.22
            go-version-file: 'go.mod'
            cache-dependency-path: go.sum

      - name: Install Govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: GoVulncheck
        continue-on-error: true
        run: govulncheck ./... > govulncheck-report.txt
        working-directory: backend

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
            node-version: '20'
            cache: npm
            cache-dependency-path: frontend/package-lock.json

      - name: Run Dependency Scan for Node
        run: npm audit
        working-directory: frontend

      - name: Upload Report to Artifacts
        if: always() # Ensures report uploads even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-report-${{ matrix.folder }}
          path: ${{ matrix.folder }}/npm-audit-report.json
          retention-days: 5

      - name: Enforce Dependency Scan Results
        working-directory: ${{ matrix.folder }}
        run: |
          echo "Checking for High and Critical vulnerabilities..."
          npm audit --audit-level=high