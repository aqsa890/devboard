name: Dependency Scan

on:
  workflow_call:

jobs:
  dependency-scan:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        folder:
          - frontend
          - backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------
      # Backend - Go
      # -------------------------

      - name: Setup Go
        if: matrix.folder == 'backend'
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install Govulncheck
        if: matrix.folder == 'backend'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Go Vulnerability Scan
        if: matrix.folder == 'backend'
        run: |
          mkdir -p reports
          govulncheck ./... > reports/govulncheck-report.txt
        working-directory: backend

      # -------------------------
      # Frontend - Node
      # -------------------------

      - name: Setup Node
        if: matrix.folder == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        if: matrix.folder == 'frontend'
        run: npm ci
        working-directory: frontend

      - name: Run Node Dependency Scan
        if: matrix.folder == 'frontend'
        run: |
          mkdir -p reports
          npm audit --json > reports/npm-audit-report.json
        working-directory: frontend
        continue-on-error: true

      - name: Enforce Dependency Scan Results
        if: matrix.folder == 'frontend'
        run: |
          echo "Checking for High and Critical vulnerabilities..."
          npm audit --audit-level=high
        working-directory: frontend

      # -------------------------
      # Upload Reports
      # -------------------------

      - name: Upload Dependency Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-report-${{ matrix.folder }}
          path: |
            frontend/reports/
            backend/reports/
          retention-days: 5