name: code deploy 
on:
  workflow_dispatch:
jobs:
  deploy-prod:
    name: deploy-prod
    runs-on: self-hosted
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Install Docker and Docker Compose
        run: |
          if ! command -v docker &> /dev/null; then
            echo "Docker not found. Installing..."
            if command -v apt-get &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            elif command -v dnf &> /dev/null; then
              sudo dnf install -y docker
            elif command -v yum &> /dev/null; then
              sudo amazon-linux-extras install docker -y || sudo yum install -y docker
            else
              echo "Unsupported package manager. Please install Docker manually."
              exit 1
            fi
          fi
          
          if command -v systemctl &> /dev/null; then
            sudo systemctl start docker || true
            sudo systemctl enable docker || true
          fi
          
          sudo chmod 666 /var/run/docker.sock || true

          if ! docker compose version &> /dev/null; then
            echo "Docker Compose not found. Installing..."
            mkdir -p ~/.docker/cli-plugins/
            curl -SL "https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)" -o ~/.docker/cli-plugins/docker-compose
            chmod +x ~/.docker/cli-plugins/docker-compose
          fi
          
          docker --version
          docker compose version

      - name: Copy Example Env to main env
        run: cp .env.example .env

      - name: Docker Setup [Login]
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy the containers with Docker Compose
        run: |
          docker compose up -d
   