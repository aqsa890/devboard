name: "Job 14: Deploy Staging"

on:
  workflow_call:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-staging:
    name: "Deploy to Staging EC2"
    environment: staging
    runs-on: self-hosted
    env:
      EC2_HOST: ${{ secrets.EC2_STAGING_HOST }}
    steps:
      - name: Deploy to EC2 Staging Instance
        run: |
          cd /opt/devboard || mkdir -p /opt/devboard && cd /opt/devboard
          docker compose down || true
          IMAGE_TAG=latest docker compose pull || true
          IMAGE_TAG=latest docker compose up -d
