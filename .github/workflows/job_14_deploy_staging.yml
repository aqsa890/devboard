name: "Job 14: Deploy Staging"

on:
  workflow_call:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-staging:
    name: "Deploy to Staging EC2"
    environment: staging
    runs-on: self-hosted
    steps:
      - name: Deploy to EC2 Staging Instance via SSH
        if: secrets.EC2_STAGING_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_STAGING_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/devboard || mkdir -p /opt/devboard && cd /opt/devboard
            docker compose down || true
            IMAGE_TAG=latest docker compose pull || true
            IMAGE_TAG=latest docker compose up -d
