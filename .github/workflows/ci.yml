name: devboard CI

on: 
  - push
  - workflow_dispatch

jobs:
  install-and-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: cloning code
        uses: actions/checkout@v4
        
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: frontend

      - name: Run lint
        run: npm run lint
        working-directory: frontend

      - name: Run tests
        run: npm test
        working-directory: frontend

          
  install-and-test-backend:
    runs-on: ubuntu-latest
    needs: install-and-test-frontend
    steps:
      - name: cloning code
        uses: actions/checkout@v4
        
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      
      - name: Install deps
        run: go mod download
        working-directory: backend
    
      - name: Install vet
        run: go vet
        working-directory: backend
        
      - name: Run tests
        run: go test -v ./...
        working-directory: backend
