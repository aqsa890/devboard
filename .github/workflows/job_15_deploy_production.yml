name: "Job 15: Deploy Production"

on:
  workflow_call:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-production:
    name: "Deploy to Production EC2"
    environment: production
    runs-on: self-hosted
    steps:
      - name: Deploy to EC2 Production Instance via SSH
        if: secrets.EC2_PRODUCTION_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PRODUCTION_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/devboard || mkdir -p /opt/devboard && cd /opt/devboard
            docker compose down || true
            IMAGE_TAG=latest docker compose pull || true
            IMAGE_TAG=latest docker compose up -d
            curl -s -f http://localhost:8081/health || exit 1
