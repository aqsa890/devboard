name: Production SecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: write
  deployments: write

jobs:
  # =========================================================================
  # STAGE 1: Parallel Code & Infrastructure Security Scans
  # =========================================================================
  job-1-secret-scan:
    name: "Job 1: Secret Scan"
    uses: ./.github/workflows/job_1_secret_scan.yml
    secrets: inherit

  job-2-lint:
    name: "Job 2: Code Linting"
    uses: ./.github/workflows/job_2_lint.yml
    secrets: inherit

  job-3-sast-sonarqube:
    name: "Job 3: SAST (SonarQube)"
    uses: ./.github/workflows/job_3_sast_sonarqube.yml
    secrets: inherit

  job-4-dependency-sca:
    name: "Job 4: Dependency / SCA Scan"
    uses: ./.github/workflows/job_4_dependency_sca.yml
    secrets: inherit

  job-5-iac-security:
    name: "Job 5: IaC Security Scan"
    uses: ./.github/workflows/job_5_iac_security.yml
    secrets: inherit

  # =========================================================================
  # SECURITY GATE 1
  # =========================================================================
  security-gate-1:
    name: "Security Gate 1"
    needs: [job-1-secret-scan, job-2-lint, job-3-sast-sonarqube, job-4-dependency-sca, job-5-iac-security]
    uses: ./.github/workflows/security_gate_1.yml
    secrets: inherit

  # =========================================================================
  # STAGE 2: Testing, Container Build & Artifact Security
  # =========================================================================
  job-6-unit-tests:
    name: "Job 6: Unit Tests"
    needs: [security-gate-1]
    uses: ./.github/workflows/job_6_unit_tests.yml
    secrets: inherit

  job-7-build:
    name: "Job 7: Build Containers"
    needs: [job-6-unit-tests]
    uses: ./.github/workflows/job_7_build.yml
    secrets: inherit

  job-8-generate-sbom:
    name: "Job 8: Generate SBOM"
    needs: [job-7-build]
    uses: ./.github/workflows/job_8_generate_sbom.yml
    secrets: inherit

  job-9-container-scan:
    name: "Job 9: Container Scan"
    needs: [job-7-build]
    uses: ./.github/workflows/job_9_container_scan.yml
    secrets: inherit

  job-10-integration-tests:
    name: "Job 10: Integration Tests"
    needs: [job-7-build]
    uses: ./.github/workflows/job_10_integration_tests.yml
    secrets: inherit

  # =========================================================================
  # STAGE 3: Test Deployment & DAST Analysis
  # =========================================================================
  job-11-deploy-test:
    name: "Job 11: Deploy Test Instance"
    needs: [job-8-generate-sbom, job-9-container-scan, job-10-integration-tests]
    uses: ./.github/workflows/job_11_deploy_test.yml
    secrets: inherit

  job-12-dast-zap:
    name: "Job 12: DAST / ZAP Scan"
    needs: [job-11-deploy-test]
    uses: ./.github/workflows/job_12_dast_zap.yml
    secrets: inherit

  # =========================================================================
  # FINAL SECURITY GATE
  # =========================================================================
  final-security-gate:
    name: "Final Security Gate"
    needs: [job-12-dast-zap]
    uses: ./.github/workflows/final_security_gate.yml
    secrets: inherit

  # =========================================================================
  # STAGE 4: Release & Deployment Delivery
  # =========================================================================
  job-13-build-release:
    name: "Job 13: Build Release & Push Registry"
    needs: [final-security-gate]
    uses: ./.github/workflows/job_13_build_release.yml
    secrets: inherit

  job-14-deploy-staging:
    name: "Job 14: Deploy to Staging EC2"
    needs: [job-13-build-release]
    uses: ./.github/workflows/job_14_deploy_staging.yml
    secrets: inherit

  job-15-deploy-production:
    name: "Job 15: Deploy to Production EC2"
    needs: [job-14-deploy-staging]
    uses: ./.github/workflows/job_15_deploy_production.yml
    secrets: inherit
