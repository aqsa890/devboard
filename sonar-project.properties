# SonarQube Project Configuration
sonar.projectKey=devboard
sonar.projectName=DevBoard - Production SecOps
sonar.projectVersion=1.0.0

# Source code locations
sonar.sources=backend,frontend/src
sonar.tests=backend,frontend/src
sonar.test.inclusions=backend/*_test.go,frontend/src/**/*.test.jsx,frontend/src/**/*.test.js

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/init/**,**/*.png,**/*.jpg,**/*.svg

# Go Specific Configurations
sonar.go.coverage.reportPaths=backend/coverage.out

# JavaScript / Frontend Configurations
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Source Encoding
sonar.sourceEncoding=UTF-8
