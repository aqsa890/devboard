name: devboard

services:
  postgres:
    container_name: postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devboard}
      POSTGRES_DB: ${POSTGRES_DB:-devboard}
    volumes:
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devboard} -d ${POSTGRES_DB:-devboard}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devboard-net

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rayyan12311/devboard-backend:${IMAGE_TAG:-v1.0.0}
    restart: unless-stopped
    environment:
      PORT: "${BACKEND_PORT:-8080}"
      POSTGRES_URL: "postgres://${POSTGRES_USER:-devboard}:${POSTGRES_PASSWORD:-devboard}@postgres:5432/${POSTGRES_DB:-devboard}?sslmode=disable"
    ports:
      - "${BACKEND_HOST_PORT:-8081}:${BACKEND_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${BACKEND_PORT:-8080}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - devboard-net

  frontend:
    container_name: devboard-FE
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: rayyan12311/devboard-frontend:${IMAGE_TAG:-v1.0.0}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - devboard-net

networks:
  devboard-net:
    driver: bridge

volumes:
  pgdata: