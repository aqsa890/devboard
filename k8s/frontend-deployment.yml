kind: Deployment
apiVersion: apps/v1
metadata:
  name: devboard-frontend-deployment
  namespace: devboard
  labels:
    app:  devboard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devboard-frontend
  template:  
    metadata:
      labels:
        app: devboard-frontend
    spec:
      containers:
        - name: devboard-frontend
          image: elsa888/devboard-frontend:latest
          ports:
            - containerPort: 8080
      


